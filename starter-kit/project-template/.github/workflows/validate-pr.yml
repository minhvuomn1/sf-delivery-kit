name: Validate PR
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npm run test:unit
      - run: npm i -g @salesforce/cli
      # TODO: login bằng SFDX auth URL (secret) rồi validate:
      # - run: sf project deploy validate -o ci-sandbox --test-level RunLocalTests
